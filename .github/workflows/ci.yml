name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A new push to the same PR or branch cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read the code; cancel this run when a newer commit superseded it
permissions:
  contents: read
  actions: write

jobs:
  check:
    name: Check, Lint, Test
    # Falls back to GitHub-hosted whenever USE_SELF_HOSTED is unset; without the
    # fallback the job queues forever if no self-hosted runner is registered.
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJson('["self-hosted", "linux", "x64", "nubi"]') || 'ubuntu-latest' }}

    steps:
      # A run still waiting for a runner when a newer push lands is not always
      # cancelled by `concurrency`; once it gets one, it stops itself instead of
      # testing a commit that is no longer the tip.
      - name: Stop if a newer commit superseded this one
        env:
          TOKEN: ${{ github.token }}
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          MINE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          tip=$(git -c http.extraHeader="Authorization: basic $auth" ls-remote "${{ github.server_url }}/${{ github.repository }}.git" "$REF" | cut -f1) || true
          if [ -n "$tip" ] && [ "$tip" != "$MINE" ]; then
            echo "Superseded by $tip; cancelling this run."
            curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" > /dev/null \
              && sleep 300 || echo "Could not cancel; carrying on."
          fi
      - uses: actions/checkout@v4

      # The self-hosted image has no C compiler, which the build scripts of
      # proc-macro2 and friends need as a linker. Same step as the engine's CI.
      - name: Install build dependencies (self-hosted)
        if: ${{ vars.USE_SELF_HOSTED == 'true' }}
        run: |
          if command -v dnf &> /dev/null; then
            sudo dnf install -y gcc
          elif command -v yum &> /dev/null; then
            sudo yum install -y gcc
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test
