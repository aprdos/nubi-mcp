[package]
name = "nubi-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for nubi - connect any AI agent to nubi"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full", "io-std", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
thiserror = "2"
futures = "0.3"
tokio-stream = "0.1"
